name: lint
on: [push, pull_request]
jobs:
  decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q decoder tools tests
      - run: python tools/redact.py --check samples/
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m decoder stats samples/
